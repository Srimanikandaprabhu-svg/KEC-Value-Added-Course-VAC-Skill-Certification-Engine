version: '3.8'

services:
  db-host:
    image: mysql:8.0
    container_name: kec-vac-db-host
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # Maps host port 3307 to container port 3306 (avoiding conflict with local MySQL 3306)
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      # Auto-initialization scripts executed in alphanumeric order
      - ./sql/kec_vac_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docker/02-remote-user.sql:/docker-entrypoint-initdb.d/02-remote-user.sql:ro
      - kec_vac_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "vacuser", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kec_vac_data:
    name: kec_vac_db_volume
