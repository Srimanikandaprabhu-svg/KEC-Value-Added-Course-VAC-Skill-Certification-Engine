# ==============================================================================
# KEC VAC Database Host (Student 2 Role) - Standalone MySQL 8 Configuration
# Dedicated Port 3307 Instance (Completely isolated from local 3306)
# ==============================================================================

[mysqld]
port=3307
bind-address=0.0.0.0
datadir="E:/mysql-remote-data"
mysqlx=0
default_authentication_plugin=mysql_native_password
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
max_connections=50
connect_timeout=10
